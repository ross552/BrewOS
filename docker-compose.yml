services:
  postgres:
    image: postgres:16-alpine
    container_name: brewos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brewos
      POSTGRES_PASSWORD: brewos
      POSTGRES_DB: brewos
    ports:
      - "5432:5432"
    volumes:
      - brewos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewos -d brewos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  brewos_pgdata:
